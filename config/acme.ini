[basic.config]
cseType=MN
cseID=id-ccgn
cseName=cse-ccgn
adminID=CAdmin
cseHost=127.0.0.1
httpPort=7579
networkInterface=127.0.0.1
logLevel=warn
databaseType=memory

[cse]
enableRemoteCSE=false

[cse.security]
enableACPChecks=true

[cse.registration]
allowedAEOriginators=CAdmin,Ctemp,Cdoor,Cdetector

[database]
type=memory

[http]
enableManagementEndpoint=false
enableUpperTesterEndpoint=false
enableStructureEndpoint=false

[mqtt]
enable=false

[coap]
enable=false

[websocket]
enable=false

[textui]
enable=false

[webui]
enable=false

[logging]
enableFileLogging=true
enableScreenLogging=false
